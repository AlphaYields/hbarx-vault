[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 50
via_ir = true
evm_version = "cancun"

[profile.default.fuzz]
runs = 256

# The test suite's mock tokens and pools cut corners on purpose; lint the vault.
[lint]
ignore = ["test/AyHbarVault.t.sol"]
